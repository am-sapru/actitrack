<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | ActiTrack</title>
    <link rel="stylesheet" href="/resource/css/dashboard/login/login.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="card">
            <div class="title">
                <h1 class="text">
                    Log In
                </h1>
            </div>
            <div class="form">
                <a href="/signup" class="signupbutton">Sign Up</a>
                <form class="form" id="mainform">
                    <label>
                        Username
                        <input type="text" id="username" class="usernameinput input">
                    </label>

                    <label>
                        Password
                        <input type="password" id="password" class="passwordinput input">
                    </label>
                    <br>
                    <input type="submit" value="Submit" class="submitbutton">
                </form>
                <div class="errorarea" id="errorarea"></div>
            </div>
        </div>
    </div>

    <script src="/resource/js/login/login.js" type="module"></script>
</body>
</html>
