            <div class="main-area" id="main_area">
                <div class="maintitle">
                    <h1 class="maintitleh1">Home</h1>
                </div>
                <div class="topcards">
                    <div class="todoactivities">
                        <h2 class="titleofsection">
                            To Do
                        </h2>
                        <div class="sectioncontent">
                            <i class="nothingtodo">Good Work! Nothing due!</i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="toastarea" id="toastarea"></div>
    <dialog class="accountsettingsdialog" id="accountsettingspage">
        <div class="accsettopbtns">
            <button class="deleteaccountbutton" id="accsetdeleteaccount">Delete Account</button>
            <div class="accsetclose" id="accsetclose"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#121212"><path d="m480-424 116 116q11 11 28 11t28-11q11-11 11-28t-11-28L536-480l116-116q11-11 11-28t-11-28q-11-11-28-11t-28 11L480-536 364-652q-11-11-28-11t-28 11q-11 11-11 28t11 28l116 116-116 116q-11 11-11 28t11 28q11 11 28 11t28-11l116-116Zm0 344q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg></div>
        </div>
        <h1 class="accsettingstitle">
            Account Settings
        </h1>
        <p id="accsetusername">There is no username. This is a bug.</p>
        <div class="accountarea">
            <label class="emaillabel accsetlabel">
                Email
                <input type="text" id="accsetemailinput" class="accsetemailinput accsetinput">
            </label>
            <label class="passwordlabel accsetlabel">
                Password
                <input type="password" id="accsetpasswordinput" class="accsetpasswordinput accsetinput">
            </label>
            <button class="accsettogglepassword" id="accsettogglepassword">Show</button>
        </div>
    </dialog>
    <dialog class="confirmaccdeletedialog" id="confirmaccdeletedialog">
        <h2 class="titleaccdeletedi">
            Type <i>CONTINUE</i> to confirm.
        </h2>
        <label>
            <input type="text" id="accdeleteconfirminputbox" class="accdeleteconfirminputbox" placeholder="Are you sure?">
        </label>
        <div class="accdeletedibuttons">
            <button class="accdelcancel accdelbutton" id="accdelcancel">Cancel</button>
            <button class="accdelcontinue accdelbutton" id="accdelcontinue">Continue</button>
        </div>
    </dialog>

    <script src="/resource/js/dashboard/main/dashboard.js"></script>
